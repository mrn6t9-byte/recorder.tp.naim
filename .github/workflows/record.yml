name: Stream Recorder

on:
  workflow_dispatch:
    inputs:
      stream_url:
        description: "Authorized .m3u8 or .ts URL"
        required: true
        type: string
      duration_hours:
        description: "Recording duration"
        required: true
        type: choice
        options:
          - "4"
          - "8"
        default: "4"
      segment_mb:
        description: "Approximate segment size"
        required: true
        type: choice
        options:
          - "1900"
          - "1000"
          - "500"
        default: "1900"

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record stream
        env:
          STREAM_URL: ${{ inputs.stream_url }}
          DURATION_HOURS: ${{ inputs.duration_hours }}
          SEGMENT_MB: ${{ inputs.segment_mb }}
          OUTPUT_DIR: output
        run: python -m recorder.recorder

      - name: Upload recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-recording-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
